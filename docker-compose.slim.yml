services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-server-slim
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-slim
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    restart: unless-stopped
    networks:
      - rag-network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-celery-slim
    command: celery -A celery_worker.celery_app worker --loglevel=info
    volumes:
      - C:\Users\IT\Desktop\Folder test:/app/pdf_source:ro
      - ./fisiere_indexate.json:/app/fisiere_indexate.json
      - ./logs:/app/logs
    environment:
      - INDEXING_FOLDER=/app/pdf_source
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:

          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api-1:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pdf-api-1-slim
    command: gunicorn api_cautare:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    volumes:
      - ./logs:/app/logs
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - WORKERS=4
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  api-2:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pdf-api-2-slim
    command: gunicorn api_cautare:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    volumes:
      - ./logs:/app/logs
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - WORKERS=4
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy-slim
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web_cautare.html:/usr/share/nginx/html/index.html:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      - api-1
      - api-2

  redis:
    image: redis:alpine
    container_name: redis-cache-slim
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3



networks:
  rag-network:
    driver: bridge

volumes:
  qdrant_storage:
  ollama:
  redis_data:

