version: '3.8'

services:
  # Qdrant Vector Database (Server)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-server
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - rag-network
  # Serviciu de indexare automată
  indexare:
    build: .
    container_name: pdf-indexare
    command: python serviciu_indexare.py
    volumes:
      # Montăm folderul cu PDF-uri (schimbă calea cu a ta)
      - //192.168.27.44/it/copy cosmin creta/Documentatie/Documentatie lucru:/app/pdf_source:ro
      # Baza de date Qdrant (persistentă)
      # Fișierul de tracking
      - ./fisiere_indexate.json:/app/fisiere_indexate.json
      # Loguri
      - ./logs:/app/logs
    environment:
      - INDEXING_FOLDER=/app/pdf_source
      - QDRANT_URL=http://qdrant:6333
    restart: unless-stopped
    networks:
      - rag-network

  # Serviciu de căutare (API)
  api:
    build: .
    container_name: pdf-api
    command: python api_cautare.py
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      - qdrant
      - indexare

networks:
  rag-network:
    driver: bridge

volumes:
  qdrant_storage:
